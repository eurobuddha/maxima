<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlons</title>
<style>
  :root { color-scheme: light dark; --ink:#1a1a1a; --mute:#6b6b6b; --line:#d9d9d9; --bg:#fafafa; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ececec; --mute:#9a9a9a; --line:#333; --bg:#111; --card:#1b1b1b; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:1em; padding:1em 1.5em; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1em; margin:0; letter-spacing:.02em; }
  header .state { color:var(--mute); font-size:.9em; }
  main { max-width:64em; margin:0 auto; padding:1.5em; display:grid; gap:1.5em; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1em 1.25em; }
  h2 { font-size:.8em; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin:0 0 .6em; }
  code, pre { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .addr { overflow-wrap:anywhere; }
  button { font:inherit; padding:.45em .9em; border:1px solid var(--ink); background:transparent; color:var(--ink); border-radius:10px; cursor:pointer; }
  button:hover { background:var(--ink); color:var(--bg); }
  table { border-collapse:collapse; width:100%; }
  td { padding:.35em 0; border-top:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  td:first-child { white-space:nowrap; padding-right:1em; color:var(--mute); }
  #events { max-height:16em; overflow:auto; }
  .muted { color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>Parlons</h1>
  <span class="state" id="state">connecting…</span>
</header>
<main>
  <section>
    <h2>This account</h2>
    <table>
      <tr><td>Name</td><td id="name">…</td></tr>
      <tr><td>Address</td><td class="addr" id="address">…</td></tr>
      <tr><td>Version</td><td id="version">…</td></tr>
    </table>
  </section>
  <section>
    <h2>Pair a phone</h2>
    <p id="inviteText" class="muted">No pairing code is outstanding.</p>
    <pre id="invite"></pre>
    <p><button id="newcode">New pairing code</button></p>
  </section>
  <section>
    <h2>Devices</h2>
    <table id="devices"><tr><td class="muted">…</td></tr></table>
  </section>
  <section>
    <h2>Live events</h2>
    <pre id="events" class="muted">(messages, delivery ticks and calls appear here as they happen)</pre>
  </section>
</main>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s);

  async function api(method, body) {
    const r = await fetch('/api/' + method, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    if (r.status === 401) { $('state').textContent = 'signed out - open the panel with a fresh link'; throw new Error('401'); }
    return r.json();
  }
  async function get(name) {
    const r = await fetch('/api/' + name, { credentials: 'same-origin' });
    return r.json();
  }

  async function refresh() {
    const p = await api('ping');
    $('name').textContent = esc(p.name);
    $('address').textContent = esc(p.permanent || p.address || '');
    const st = await api('node.status');
    $('version').textContent = esc(st.version);
    const inv = await get('invite');
    if (inv.invite) {
      $('inviteText').textContent = 'Scan or paste this in the Parlons app (the code half works once):';
      $('invite').textContent = inv.invite;
    } else {
      $('inviteText').textContent = 'No pairing code is outstanding.';
      $('invite').textContent = '';
    }
    const d = await api('pair.list');
    const rows = [];
    for (const dev of (d.authorized || [])) {
      rows.push('<tr><td>' + (dev.local ? 'this computer' : 'paired') + '</td><td>'
        + esc(dev.label).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
        + '<br><code>' + esc(dev.key) + '</code></td></tr>');
    }
    for (const k of (d.pending || [])) {
      rows.push('<tr><td>waiting</td><td><code>' + esc(k) + '</code></td></tr>');
    }
    $('devices').innerHTML = rows.join('') || '<tr><td class="muted">none</td></tr>';
    $('state').textContent = 'connected';
  }

  $('newcode').addEventListener('click', async () => {
    await api('pair.newcode');
    setTimeout(refresh, 800);   // the invite file follows within a moment
  });

  function listen() {
    const es = new EventSource('/events');
    es.addEventListener('push', e => {
      const box = $('events');
      if (box.classList.contains('muted')) { box.classList.remove('muted'); box.textContent = ''; }
      box.textContent = new Date().toLocaleTimeString() + '  ' + e.data + '\n' + box.textContent;
      if (e.data.indexOf('"type":"message"') >= 0) { refresh(); }
    });
    es.onerror = () => { $('state').textContent = 'reconnecting…'; };
    es.addEventListener('hello', () => { $('state').textContent = 'connected'; });
  }

  refresh().then(listen).catch(() => {});
})();
</script>
</body>
</html>
