<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlons</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Parlons <span class="me" id="meName"></span></div>
    <nav class="nav">
      <button data-route="chats" class="on">Chats</button>
      <button data-route="contacts">Contacts</button>
      <button data-route="devices">Devices</button>
      <button data-route="node">Node</button>
      <button data-route="settings">Settings</button>
    </nav>
    <div class="state" id="state">connecting…</div>
  </header>
  <div class="body" id="body">
    <aside class="list" id="list">
      <div class="listhead">
        <input id="search" type="search" placeholder="Search chats and messages" autocomplete="off">
        <button id="newGroup" class="ghost" title="New group">+ Group</button>
      </div>
      <div id="listItems" class="items"></div>
    </aside>
    <main class="pane" id="pane">
      <div class="empty" id="paneEmpty">
        <div class="emptyTitle">Your account is up.</div>
        <div class="emptyText">Pick a conversation, or add someone in Contacts.</div>
      </div>
    </main>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
