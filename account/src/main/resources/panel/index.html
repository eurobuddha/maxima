<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlons</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app" id="app">
  <section class="phone" id="phone">
    <header class="bar">
      <div class="titles">
        <div class="titlerow"><span class="title">Parlons!</span><span class="ver" id="ver"></span></div>
        <div class="credit">Powered by Maxima</div>
      </div>
      <div class="hpill"><span class="dot" id="dot"></span><span class="ptext" id="state">starting…</span></div>
      <button class="ibtn" id="btnTheme" title="Theme"></button>
      <button class="ibtn" id="btnSearch" title="Search"></button>
      <button class="ibtn narrow" id="btnMore" title="More"></button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-route="chats" class="on">Chats</button>
      <button data-route="contacts">Contacts</button>
      <button data-route="devices">Devices</button>
      <button data-route="node">Node</button>
      <button data-route="settings">Settings</button>
    </nav>
    <div class="page" id="page"></div>
  </section>
  <section class="chatpane" id="chatpane">
    <div class="ground" id="ground"><div class="groundText">Pick a conversation.</div></div>
  </section>
  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="qr.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
