name: Shared engine and panel tests

# Shared engine, account, wallet-counter and panel regressions. Uses temporary data
# and loopback fixtures; no live identities, external relay or signing required.
# Android packages and desktop installers have their own build workflows.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JVM and panel regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run panel regression tests
        run: node --test account/src/test/js/panel.test.cjs

      - name: Run JVM unit tests
        shell: bash
        # -PskipAndroid keeps both AGP modules out of configuration entirely
        # (no SDK on the runner). gradle.properties pins a local Android Studio
        # JBR path that does not exist here, so point Gradle at the runner JDK.
        run: |
          ./gradlew :core:check :server:test :maxjar:test :cloud:test :node:test :wakeproxy:test :desktop:test \
            -PskipAndroid=true \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn
