name: Build desktop node (mac / win / linux)

# Manual runs produce downloadable installer artifacts; pushing a tag like
# desktop-v1.0.0 also attaches them to a GitHub Release. (Plain v* tags belong
# to the Android app releases — the desktop line has its own tag prefix.)
#
# Each runner builds its OWN platform natively: jpackage cannot cross-build, so
# the matrix IS the packaging strategy. The runner's Temurin 21 ships jpackage +
# jmods, so no jpackageJdk property is needed here (locally the build is pinned
# to the Android Studio JBR, which has neither — pass -PjpackageJdk there).
#
# SIGNING (wired, dormant until secrets exist):
#   macOS  — set MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD and
#            MACOS_SIGN_IDENTITY ("Developer ID Application: Barry Sherman (Z4JD286WF4)" —
#            the gradle build strips the prefix for jpackage), plus
#            APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID to notarize+staple.
#            Locally: desktop/release-mac.sh does sign → notarize → staple → verify.
#   Windows — set WINDOWS_CERT_PFX (base64 .pfx) and WINDOWS_CERT_PASSWORD.
# With no secrets, unsigned installers are produced (Gatekeeper: right-click
# Open; SmartScreen: More info -> Run anyway).

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write   # tag builds create the GitHub Release

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # macOS: import the Developer ID cert into a throwaway keychain (only when
      # the secret exists) so jpackage can sign the app bundle + dmg.
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac' && env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k ci-keychain build.keychain
          rm cert.p12

      - name: Build installer (jpackage)
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          ARGS=""
          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            ARGS="-PmacSignIdentity=$MACOS_SIGN_IDENTITY"
          fi
          # The repo's gradle.properties pins org.gradle.java.home to a local
          # Android Studio JBR path that does not exist on a runner — override.
          # -PskipAndroid keeps the AGP module out of configuration entirely.
          ./gradlew :desktop:jpackage $ARGS \
            -PskipAndroid=true \
            -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      # Windows: Authenticode-sign the .msi (only when the secret exists).
      - name: Sign Windows installer
        if: matrix.platform == 'win' && env.CERT != ''
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $msi = Get-ChildItem desktop/build/jpackage/*.msi | Select-Object -First 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $msi.FullName
          Remove-Item cert.pfx

      # macOS: notarize + staple (only when the Apple secrets exist).
      - name: Notarize macOS installer
        if: matrix.platform == 'mac' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls desktop/build/jpackage/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG"
          desktop/verify-mac.sh "$DMG"

      - name: Checksums
        shell: bash
        run: |
          cd desktop/build/jpackage
          for f in *.dmg *.msi *.deb; do
            [ -f "$f" ] && shasum -a 256 "$f" >> SHA256SUMS || true
          done
          cat SHA256SUMS || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maxima-node-${{ matrix.platform }}
          path: |
            desktop/build/jpackage/*.dmg
            desktop/build/jpackage/*.msi
            desktop/build/jpackage/*.deb
            desktop/build/jpackage/SHA256SUMS
          if-no-files-found: warn

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/jpackage/*.dmg
            desktop/build/jpackage/*.msi
            desktop/build/jpackage/*.deb
