name: Build signed desktop node (mac / win / linux)

# Manual runs retain verified, versioned installers as workflow artifacts.
# desktop-vX.Y.Z tags publish only after all three signed builds succeed.
# Mac uses the same two-stage app/DMG signing and notarization as local releases.
# Windows signs both the launcher and MSI. Linux ships a verified detached OpenPGP signature.
# Missing signing credentials fail before packaging; there is no unsigned publication path.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Require signing credentials and matching release version
        id: release
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_FINGERPRINT: ${{ secrets.LINUX_SIGNING_FINGERPRINT }}
        run: python desktop/release-check.py

      - name: Import Mac identity and notarization profile
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_FILE="$RUNNER_TEMP/parlons-signing.p12"
          KEYCHAIN="$RUNNER_TEMP/parlons-build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERT" | base64 --decode > "$CERT_FILE"
          trap 'rm -f "$CERT_FILE"' EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          xcrun notarytool store-credentials parlons-ci --keychain "$KEYCHAIN" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Build signed and notarized Mac installer
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: GRADLE_JAVA_HOME="$JAVA_HOME" JPACKAGE_JDK="$JAVA_HOME" NOTARY_KEYCHAIN="$RUNNER_TEMP/parlons-build.keychain-db" desktop/release-mac.sh "$MACOS_SIGN_IDENTITY" parlons-ci

      - name: Build Windows app image
        if: matrix.platform == 'win'
        shell: bash
        run: ./gradlew :desktop:jpackageImage -PskipAndroid=true -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Sign Windows app and package signed installer
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./desktop/release-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Build Linux installer
        if: matrix.platform == 'linux'
        shell: bash
        run: ./gradlew :desktop:jpackage -PskipAndroid=true -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon

      - name: Sign and verify Linux installer
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_FINGERPRINT: ${{ secrets.LINUX_SIGNING_FINGERPRINT }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          files=(desktop/build/jpackage/*.deb)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo 'Expected exactly one Linux installer'; exit 1; }
          python desktop/sign-linux.py "${files[0]}" "$RELEASE_VERSION"

      - name: Checksums for verified artifacts
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib, os, re
          from pathlib import Path
          root = Path('desktop/build/jpackage')
          platform = os.environ['RELEASE_PLATFORM']
          version = os.environ['RELEASE_VERSION']
          suffix = {'mac': '.dmg', 'win': '.msi', 'linux': '.deb'}[platform]
          installers = list(root.glob('*' + suffix))
          if len(installers) != 1 or not re.search(r'(?<![0-9.])' + re.escape(version) + r'(?![0-9.])', installers[0].name):
              raise SystemExit('Expected exactly one installer with the release version in its name')
          files = installers
          if platform == 'linux':
              files += [installers[0].with_name(installers[0].name + '.asc'), root / 'Parlons-signing-key.asc']
          rows = []
          for path in files:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 20), b''):
                      digest.update(block)
              rows.append(f'{digest.hexdigest()}  {path.name}')
          (root / ('SHA256SUMS-' + platform)).write_text('\n'.join(rows) + '\n')
          PY

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maxima-node-${{ matrix.platform }}
          path: |
            desktop/build/jpackage/*.dmg
            desktop/build/jpackage/*.msi
            desktop/build/jpackage/*.deb
            desktop/build/jpackage/*.asc
            desktop/build/jpackage/SHA256SUMS-*
          if-no-files-found: error

      - name: Remove Mac signing material
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/parlons-signing.p12"
          if [ -f "$RUNNER_TEMP/parlons-build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/parlons-build.keychain-db"
          fi

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maxima-node-*
          path: signed-installers
          merge-multiple: true
      - name: Attach all verified platforms to release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            signed-installers/*.dmg
            signed-installers/*.msi
            signed-installers/*.deb
            signed-installers/*.asc
            signed-installers/SHA256SUMS-*
