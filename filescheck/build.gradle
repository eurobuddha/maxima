plugins { alias(libs.plugins.android.application) }
android {
    namespace 'com.eurobuddha.filescheck'
    compileSdk 36
    defaultConfig { applicationId 'com.eurobuddha.filescheck'; minSdk 28; targetSdk 35; versionCode 1; versionName 'test' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    // Import only the Android smoke suite used by MainActivity; the file-manager suite is JVM-only.
    sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sha3'))
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] }
}
dependencies { implementation project(':files'); implementation('com.github.atomashpolskiy:bt-core:1.10') { exclude group: 'com.google.inject', module: 'guice' }; implementation 'org.bouncycastle:bcprov-jdk15on:1.69'; implementation 'junit:junit:4.13.2' }

tasks.register('copySha3', Copy) {
    from '../app/src/main/java/com/eurobuddha/maxima/app/Sha3Provider.java'
    into layout.buildDirectory.dir('generated/sha3/com/eurobuddha/maxima/app')
}
tasks.named('preBuild').configure { dependsOn 'copySha3' }

tasks.register('copyChatLinkText', Copy) {
    from '../chatshared/com/eurobuddha/maxima/app/chat/ChatLinkText.java'
    into layout.buildDirectory.dir('generated/sha3/com/eurobuddha/maxima/app/chat')
}
tasks.named('preBuild').configure { dependsOn 'copyChatLinkText' }

// Uses the same native WebRTC and SDP helper as both production Android clients.
dependencies { implementation 'io.getstream:stream-webrtc-android:1.1.1' }
tasks.register('copyGatheredCallSdp', Copy) {
    from '../chatshared/com/eurobuddha/maxima/app/call/GatheredCallSdp.java'
    into layout.buildDirectory.dir('generated/sha3/com/eurobuddha/maxima/app/call')
}
tasks.named('preBuild').configure { dependsOn 'copyGatheredCallSdp' }

tasks.register('copyPrivateTorrentTest', Copy) {
    from '../files/src/test/java/com/eurobuddha/maxima/files/PrivateTorrentTest.java'
    into layout.buildDirectory.dir('generated/sha3/com/eurobuddha/maxima/files')
}
tasks.named('preBuild').configure { dependsOn 'copyPrivateTorrentTest' }
