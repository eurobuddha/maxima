plugins {
    id 'application'
}

/*
 * Parlons Node — the merged VPS binary: a FULL Minima node (org.minima, from the bundled
 * minima-core jar) running in one JVM alongside the clean-room :core Maxima and the Parlons
 * account layer. See the plan: "minimaCore wearing the Parlons cape".
 *
 * Guardrail: this module depends ONLY on the full node's org.minima (node/libs/minima-node.jar).
 * It must NEVER pull :minima-common or :maxjar (the vendored org.minima), or fully-qualified
 * classes (Address, JSONObject, GeneralParams, …) collide with the node's. :core and :server are
 * clean-room com.eurobuddha.* (verified: :core has no project deps, :server → :core only), so they
 * mesh with the node with no collision.
 */
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    // The full minima-core node (org.minima) — chain, P2P, wallet, MMR. Bundled jar because the
    // minima-core Gradle toolchain predates JDK 26; we compile/run it here under maxima's Gradle.
    implementation files('libs/minima-node.jar')
    // The node's own runtime deps (from core/minima-core/build.gradle).
    implementation 'com.h2database:h2:2.4.240'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'
    implementation 'mysql:mysql-connector-java:8.0.26'

    // Parlons Maxima cape (clean-room) + relay.
    implementation project(':core')
    implementation project(':server')

    implementation 'org.json:json:20231013'
}

application {
    mainClass = 'com.eurobuddha.maxima.node.ParlonsNodeMain'
}

/*
 * Self-contained runnable jar = the deployable Parlons Node binary: the bundled minima-node.jar
 * (org.minima) + :core + :server + h2/bouncycastle/mysql, all flattened under one Main-Class.
 * dependsOn/inputs on runtimeClasspath so an edit to :core/:server actually reaches the artifact
 * (a jar with a new version and old code is the worst failure mode — see :server's fatJar note).
 */
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Self-contained runnable Parlons Node jar'

    dependsOn configurations.runtimeClasspath
    inputs.files configurations.runtimeClasspath

    archiveBaseName = 'parlons-node'
    manifest {
        attributes 'Main-Class': 'com.eurobuddha.maxima.node.ParlonsNodeMain'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    // BouncyCastle jars are signed; flattening their META-INF/*.SF|DSA|RSA into one jar makes the
    // JVM fail signature verification ("Invalid signature file digest"). Drop the signatures — the
    // exclude must be scoped to the dependency tree (a task-level exclude doesn't reach zipTree).
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC', 'META-INF/INDEX.LIST'
    }
}
