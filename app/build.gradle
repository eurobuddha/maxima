plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.maxima.app'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.maxima.app"
        minSdk 28
        targetSdk 35
        versionCode 657
        versionName "0.6.57"
    }

    signingConfigs {
        release {
            // Fleet-wide signing, from ~/.gradle/gradle.properties.
            if (project.hasProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')) {
                storeFile file(MINIMA_FAMILY_RELEASE_STORE_FILE)
                storePassword MINIMA_FAMILY_RELEASE_STORE_PASSWORD
                keyAlias MINIMA_FAMILY_RELEASE_KEY_ALIAS
                keyPassword MINIMA_FAMILY_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            // Bouncy Castle and jspecify both ship META-INF/versions/9 OSGI
            // metadata; none of it is needed at runtime on Android.
            excludes += [
                    'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                    'META-INF/versions/**',
                    'META-INF/LICENSE*', 'META-INF/NOTICE*',
                    'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'
            ]
        }
    }

    // Shared wallet source (moved out of app/src so :portal can compile the same
    // code — same pattern :cloud/:desktop already use). Byte-identical; app owns nothing extra.
    sourceSets {
        main { java.srcDirs += ['../walletshared'] }
    }
}

dependencies {
    // WebRTC for voice calls - maintained prebuilt of libwebrtc (audio+video).
    implementation 'io.getstream:stream-webrtc-android:1.1.1'
    implementation project(':core')
    implementation project(':server')   // RelayRuntime — the phone can run a full relay when charging
    implementation project(':maxjar')   // classic Maxima extracted whole — the jar engine (hidden toggle)
    implementation project(':minima-common')  // shared vendored classic base (wallet engine + maxjar)
    implementation files('libs/minimaapi.aar')
    implementation libs.appcompat
    implementation 'androidx.core:core:1.13.1'
    implementation libs.material
    implementation 'androidx.recyclerview:recyclerview:1.3.2'   // chat message list
    implementation 'androidx.exifinterface:exifinterface:1.3.7'  // honour photo orientation
    implementation 'androidx.biometric:biometric:1.1.0'          // app lock: fingerprint / device PIN
    // WorkManager is the resurrection belt when the OS kills our service.
    implementation 'androidx.work:work-runtime:2.9.1'
    // Android < API 29 has no SHA3-256 in its default provider; :core takes a
    // digest supplier rather than a hard dependency, and we inject BC here.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'   // 1.7x removed the pqc.gmss Winternitz utils the vendored signer needs; 1.69 also has SHA3Digest
    // QR contact exchange: generate my address, scan a peer's.
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.caverock:androidsvg-aar:1.4'   // rasterise SVG-format token icons (ImageLoader)
}

// Every release APK lands in dist/ automatically - the sharing folder.
// (Standing rule; SHA256SUMS gets the matching line, duplicates skipped.)
tasks.register('publishToDist') {
    doLast {
        def ver = android.defaultConfig.versionName
        def apk = file("build/outputs/apk/release/app-release.apk")
        if (!apk.exists()) {
            return
        }
        def out = rootProject.file("dist/maxima-app-${ver}-release.apk")
        out.bytes = apk.bytes
        def md = java.security.MessageDigest.getInstance("SHA-256")
        def sha = md.digest(apk.bytes).collect { String.format("%02x", it) }.join()
        def sums = rootProject.file("dist/SHA256SUMS")
        def line = "${sha}  dist/maxima-app-${ver}-release.apk"
        if (!sums.exists() || !sums.text.contains(line)) {
            sums.append(line + "\n")
        }
        println "dist <- maxima-app-${ver}-release.apk (${sha})"
    }
}
afterEvaluate {
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        finalizedBy 'publishToDist'
    }
}
