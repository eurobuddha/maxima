plugins {
    id 'application'
    // jlink a minimal runtime + build a native jpackage installer per OS.
    id 'org.beryx.runtime' version '1.13.1'
}

// A fresh artifact line. macOS jpackage requires a major version >= 1
// (independent of the relay protocol version). 1.1.0 adds the windowed chat
// client alongside the relay node — kept in step with DesktopMain.APP_VERSION.
version = '1.5.47'

/*
 * The desktop node bundles its own JRE via jpackage, so it is not bound to the
 * Java-11 floor that :core keeps for Android. But building the whole family on
 * one toolchain is simpler, and nothing here needs newer bytecode, so stay at 11.
 */
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':core')
    implementation project(':server')   // RelayServer + RelayRuntime
    implementation project(':minima-common')  // shared vendored classic base (moved out of app's tree)
    implementation project(':maxjar')          // classic Maxima engine, for the "Run as Maxima classic" mode
    // Pure-Java QR encoder (same lib the phone uses) for the "share my address" QR.
    implementation 'com.google.zxing:core:3.5.3'
    // The local Maxima wallet (same code the APK uses) needs the Winternitz signer.
    // 1.7x removed the pqc.gmss classes it depends on; pin 1.69 (also has SHA3Digest).
    // NEVER upgrade — matches the family rule for the vendored signer.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'
    // org.json is bundled in Android; the wallet's Util uses it. Add the standard
    // pure-Java implementation for desktop (distinct from org.minima.utils.json).
    implementation 'org.json:json:20231013'
}

// Compile the APK's FULLY-LOCAL wallet stack + Minima objects into the desktop app,
// straight from :app's tree — same key-#1000 derivation, txn build and Winternitz
// signing done ON THE DEVICE, exactly like the phone. Only the two Android-coupled
// helpers (Identicon, PrefsKeyUses) are excluded and reimplemented for desktop.
// org.minima.* here is a curated, self-contained pure-Java subset (no android imports).
sourceSets {
    main {
        java {
            srcDir '../app/src/main/java'
            include 'com/eurobuddha/maxima/desktop/**'
            include 'org/minima/**'
            include 'com/eurobuddha/wallet/**'
            exclude 'com/eurobuddha/wallet/Identicon.java'      // android Bitmap
            exclude 'com/eurobuddha/wallet/PrefsKeyUses.java'   // android prefs
            exclude 'com/eurobuddha/wallet/ImageLoader.java'    // android Bitmap/Base64/AndroidSVG
            exclude 'com/eurobuddha/wallet/ImageTools.java'     // android-adjacent (display-side; not used on desktop)
            exclude 'com/eurobuddha/wallet/IconResolver.java'   // android.util.Base64
            exclude 'com/eurobuddha/wallet/TokenMeta.java'      // calls IconResolver (token-icon resolve is app-only for now)
        }
    }
}

application {
    mainClass = 'com.eurobuddha.maxima.desktop.DesktopMain'
    // Keep AWT headless-off so SystemTray works in relay mode. The windowed chat
    // client is a normal app with a Dock/taskbar icon, so do NOT force the macOS
    // menu-bar-accessory flag globally (relay-only installs can still set
    // -Dapple.awt.UIElement=true themselves).
    applicationDefaultJvmArgs = ['-Djava.awt.headless=false']
}

/*
 * jpackage needs a JDK that ships jpackage + jmods (JDK 14+). On CI the runner's
 * JDK (temurin 21 via setup-java) is exactly that, so nothing is set and the
 * plugin uses the running JDK. Locally the build is pinned to the Android Studio
 * JBR (no jpackage), so pass -PjpackageJdk=/path/to/a/real/jdk (or JPACKAGE_JDK).
 */
runtime {
    def jhome = project.findProperty('jpackageJdk') ?: System.getenv('JPACKAGE_JDK')
    if (jhome) {
        javaHome = jhome
    }

    // Explicit module set: java.desktop (AWT/Swing/SystemTray/imageio), plus the
    // usual networking/crypto companions. :core uses only JDK crypto (RSA/AES/
    // SHA3 via SunJCE), so no third-party crypto module is needed.
    // java.sql / java.sql.rowset: the CLASSIC (jar) engine's H2 database
    // (org.minima.database.MinimaDB) needs java.sql — without it the packaged
    // app crashes on 'Run as Maxima classic' with NoClassDefFoundError: java.sql.
    modules = ['java.base', 'java.desktop', 'java.naming', 'java.management',
               'jdk.crypto.ec', 'java.sql', 'java.sql.rowset']

    // Omit --compress: its syntax changed in newer JDKs (--compress=2 -> zip-N),
    // so leaving it out keeps one build file working across JDK 17/21/26.
    options = ['--strip-debug', '--no-header-files', '--no-man-pages']

    jpackage {
        def os = org.gradle.internal.os.OperatingSystem.current()
        imageName = 'MaximaNode'
        installerName = 'MaximaNode'
        appVersion = project.version

        // JVM args the launched app runs with. The default is now the windowed
        // chat client, so do NOT force the macOS menu-bar-accessory flag (it hides
        // the Dock icon); relay mode still shows its tray icon regardless.
        jvmArgs = ['-Djava.awt.headless=false']

        // App icon (Parlons: two amber mesh-M speech bubbles on a dark rounded
        // square) — per-OS format, else jpackage ships the generic Java icon.
        def iconFile = os.macOsX ? 'icons/Parlons.icns'
                : (os.windows ? 'icons/Parlons.ico' : 'icons/parlons-512.png')
        def iconPath = file(iconFile)
        if (iconPath.exists()) {
            imageOptions += ['--icon', iconPath.toString()]
        }

        if (os.macOsX) {
            installerType = 'dmg'
            installerOptions = ['--mac-package-identifier', 'com.eurobuddha.maxima.node',
                                '--vendor', 'eurobuddha']
            // Developer ID signing, when CI (or desktop/release-mac.sh) supplies the
            // identity: -PmacSignIdentity="Developer ID Application: Name (TEAMID)" or just
            // "Name (TEAMID)" — jpackage's --mac-signing-key-user-name wants the part AFTER the
            // "Developer ID Application: " prefix and adds the prefix itself, so strip it here.
            // jpackage signs with hardened runtime + its default entitlements; notarization +
            // stapling happen after the build (release-mac.sh / the workflow's notarize step).
            // Unsigned builds stay possible for local testing.
            def sign = project.findProperty('macSignIdentity')
            if (sign) {
                def user = sign.toString().replaceFirst(/^Developer ID Application:\s*/, '')
                imageOptions += ['--mac-sign', '--mac-signing-key-user-name', user]
                installerOptions += ['--mac-sign', '--mac-signing-key-user-name', user]
            }
        } else if (os.windows) {
            installerType = 'msi'
            installerOptions = ['--win-menu', '--win-dir-chooser', '--win-per-user-install',
                                '--vendor', 'eurobuddha']
        } else {
            // jpackage's native Linux installers are deb/rpm (AppImage is a
            // separate toolchain); deb covers the set-and-forget Ubuntu/Debian case.
            installerType = 'deb'
            installerOptions = ['--linux-shortcut', '--vendor', 'eurobuddha']
        }
    }
}
