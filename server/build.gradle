plugins {
    id 'application'
}

/*
 * :server may target a newer JDK than :core (which is pinned to 11 so Android
 * can consume it). Kept at 11 for now so one toolchain builds everything; raise
 * it if virtual threads become worth the split.
 */
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':core')
}

application {
    mainClass = 'com.eurobuddha.maxima.server.Main'
}

/** Runnable fat jar - the deploy artifact for a Pi or a VPS. */
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Self-contained runnable jar'

    /*
     * WITHOUT THIS the task zips whatever core.jar happens to be on disk.
     * Resolving runtimeClasspath inside a `from { ... }` closure hides the
     * dependency from Gradle, so :core is never rebuilt and an edit to :core
     * silently does not reach the artifact - a jar with a NEW version number
     * and OLD code in it, which is the worst possible failure mode because
     * every check downstream reports the new version.
     *
     * Caught in the wild: a greeting fix was released as 0.1.5, deployed, and
     * the relay on the wire still sent the old greeting.
     */
    dependsOn configurations.runtimeClasspath
    inputs.files configurations.runtimeClasspath

    archiveBaseName = 'maxima-server'
    manifest {
        attributes 'Main-Class': 'com.eurobuddha.maxima.server.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
