pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'maxima'

// :core is a pure JVM library shared by both hosts. It must never import
// android.* or the node IPC layer - see core/build.gradle.
include ':core'

// Added as they are built (milestones 7 and 8 in the plan):
include ':server'

// Classic Maxima, extracted whole and chain-free -> maxima.jar. Vendored
// org.minima.* sources stay diffable against core/Minima; seams in
// org.minima.maxjar. Never on the same classpath as real Minima.
include ':maxjar'

// Shared vendored classic base classes (MiniData/Crypto/json/...), used by both
// the wallet engine in :app and :maxjar. One copy or the dex merge fails.
include ':minima-common'

// The Android module needs AGP + an Android SDK just to CONFIGURE, which a
// desktop-installer CI runner may not want. -PskipAndroid=true leaves it out.
if (!providers.gradleProperty('skipAndroid').isPresent()) {
    include ':app'
}

// The set-and-forget desktop node: a native-installer app (jpackage) that runs
// the relay in-process with automatic router port-forwarding and a tray UI.
include ':desktop'

// Parlons Cloud: a HEADLESS always-on Parlons node (identity + chat + pool relay)
// for a VPS, driven remotely by paired devices. Pure JVM (:core + :server), no
// Swing, no Android. See the Parlons Cloud spec.
include ':cloud'

// Parlons Cloud PORTAL: a standalone Parlons-parity frontend for a VPS node.
// Separate app (own applicationId/icon); reuses the app look-layer, driven by :cloud ParlonsRemote.
include ':portal'
