plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
tasks.withType(JavaCompile).configureEach { options.release = 11 }
dependencies {
    api project(':core')
    implementation('com.github.atomashpolskiy:bt-core:1.10') { exclude group: 'com.google.inject', module: 'guice' }
    // Guice 5 requires reflection APIs absent on Android; upstream's no-AOP build is portable.
    implementation 'com.google.inject:guice:4.2.3:no_aop'
    implementation 'com.google.guava:guava:33.4.8-android'
    // No DHT, HTTP tracker, UPnP or other automatically loaded Bt modules.
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}
