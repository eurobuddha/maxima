<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Decentralized chat app icon</title>
  <desc id="desc">A dark rounded-square app icon with a speech bubble connected to equal peer nodes.</desc>
  <defs>
    <linearGradient id="tile" x1="32" y1="20" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202326"/>
      <stop offset="0.52" stop-color="#141719"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="tile-edge" x1="36" y1="18" x2="220" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="bubble" x1="89" y1="96" x2="164" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DEE4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAB4A"/>
      <stop offset="0.48" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88C3FF"/>
      <stop offset="0.5" stop-color="#5B93FF"/>
      <stop offset="1" stop-color="#4557FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF8A00" flood-opacity="0.35"/>
    </filter>
    <filter id="blue-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#5B93FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="46" fill="url(#tile-edge)"/>
  <rect x="21" y="21" width="214" height="214" rx="43" fill="url(#tile)" filter="url(#soft-shadow)"/>
  <path d="M38 66C45 40 62 30 93 30h70c31 0 48 10 55 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3" stroke-linecap="round"/>

  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M128 58v28" stroke="#60666E" stroke-dasharray="3 9"/>
    <path d="M128 170v28" stroke="#FF8A00" stroke-dasharray="3 9"/>
    <path d="M58 128h28" stroke="#5B93FF" stroke-dasharray="3 9"/>
    <path d="M170 128h28" stroke="#FF8A00" stroke-dasharray="3 9"/>
    <path d="M80 80l24 24" stroke="#5B93FF" stroke-dasharray="3 9"/>
    <path d="M176 80l-24 24" stroke="#5B93FF" stroke-dasharray="3 9"/>
    <path d="M80 176l24-24" stroke="#5B93FF" stroke-dasharray="3 9"/>
    <path d="M176 176l-24-24" stroke="#5B93FF" stroke-dasharray="3 9"/>
  </g>

  <g filter="url(#soft-shadow)">
    <path
      d="M102 93h48c19 0 34 14 34 31s-15 31-34 31h-23l-25 21v-22c-17-3-30-16-30-30 0-17 14-31 30-31Z"
      fill="#141719"
      stroke="url(#bubble)"
      stroke-width="6"
      stroke-linejoin="round"/>
  </g>

  <g>
    <circle cx="128" cy="47" r="13" fill="url(#orange)" filter="url(#node-glow)"/>
    <circle cx="128" cy="209" r="13" fill="url(#orange)" filter="url(#node-glow)"/>
    <circle cx="47" cy="128" r="13" fill="url(#orange)" filter="url(#node-glow)"/>
    <circle cx="209" cy="128" r="13" fill="url(#orange)" filter="url(#node-glow)"/>

    <circle cx="73" cy="73" r="13" fill="url(#blue)" filter="url(#blue-glow)"/>
    <circle cx="183" cy="73" r="13" fill="url(#blue)" filter="url(#blue-glow)"/>
    <circle cx="73" cy="183" r="13" fill="url(#blue)" filter="url(#blue-glow)"/>
    <circle cx="183" cy="183" r="13" fill="url(#blue)" filter="url(#blue-glow)"/>
  </g>

  <g fill="#FFFFFF" opacity="0.12">
    <circle cx="124" cy="43" r="4"/>
    <circle cx="69" cy="69" r="4"/>
    <circle cx="43" cy="124" r="4"/>
    <circle cx="179" cy="69" r="4"/>
  </g>
</svg>
